[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiverse_client_py"
version = "1.1.0"
description = "Python bindings for Multiverse Client (pybind extension)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

authors = [{ name = "Giang Nguyen" }, { name = "Kien Bui" }]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
]

dependencies = [
  "numpy>=1.23",
]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["multiverse_client_py*"]

[tool.setuptools.package-data]
multiverse_client_py = [
  "*.so",
  "*.dll",
]
